name: JOBA HTTPS deployment
on:
  push:
    branches: [deploy/joba]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: joba-production
  cancel-in-progress: false
env:
  JOBA_DOMAIN: 188-241-217-228.sslip.io
  JOBA_SSH_HOST_FINGERPRINT: SHA256:Bt3HkaktjLmWe4tB1pOK9b8gOnHuxp+tvp1hhEDtxp8
  JOBA_SSH_HOST: 188.241.217.228
  JOBA_SSH_PORT: '22'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/inspect-deployment-target.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-public-host-keys
          path: server-known-hosts.txt
          retention-days: 7
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER_ROOT: ${{ github.workspace }}/.flutter-sdk
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/.joba-config
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -q && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run verify
      - name: Verify mobile admin layouts and navigation
        run: node scripts/verify-admin-mobile.cjs
        env:
          JOBA_CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          "$FLUTTER_ROOT/bin/flutter" precache --web --linux
      - name: Verify Flutter
        working-directory: apps/mobile
        run: |
          "$FLUTTER_ROOT/bin/flutter" pub get --enforce-lockfile
          "$FLUTTER_ROOT/bin/flutter" analyze --no-pub
          "$FLUTTER_ROOT/bin/flutter" test --reporter expanded
      - name: Verify server image without cloud-specific CA mounts
        run: docker build -f services/api/Dockerfile -t joba-api:verified .
      - run: bash scripts/build-web-release.sh
      - run: tar -czf release-web.tgz -C release web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-web
          path: release-web.tgz
          retention-days: 7
  deploy:
    permissions:
      contents: read
      checks: write
    needs: [inspect, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-web
      - name: Acquire protected deployment credential
        env:
          SSHPASS: ${{ secrets.JOBA_SSH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.JOBA_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/acquire-deployment-credential.py
      - name: Deploy exact Git revision and verify HTTPS
        env:
          SSHPASS: ${{ secrets.JOBA_SSH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.JOBA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export SSHPASS="${JOBA_RUNTIME_SSH_PASSWORD:-}"
          umask 077
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 -p "$JOBA_SSH_PORT" "$JOBA_SSH_HOST" > "$HOME/.ssh/known_hosts"
          joba_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          test "$joba_fingerprint" = "$JOBA_SSH_HOST_FINGERPRINT" || { echo 'SSH host key changed; verify the server identity before deployment'; exit 1; }
          joba_ssh=(ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -p "$JOBA_SSH_PORT")
          joba_scp=(scp -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -P "$JOBA_SSH_PORT")
          if test -n "$SSH_PRIVATE_KEY"; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/joba_deploy"
            joba_ssh+=(-i "$HOME/.ssh/joba_deploy" -o IdentitiesOnly=yes)
            joba_scp+=(-i "$HOME/.ssh/joba_deploy" -o IdentitiesOnly=yes)
          else
            sudo apt-get update -q
            sudo apt-get install -y sshpass
            joba_ssh=(sshpass -e "${joba_ssh[@]}")
            joba_scp=(sshpass -e "${joba_scp[@]}")
          fi
          joba_remote_archive="/tmp/joba-release-$GITHUB_SHA.tgz"
          "${joba_scp[@]}" release-web.tgz "root@$JOBA_SSH_HOST:$joba_remote_archive"
          joba_digest="$(sha256sum release-web.tgz | cut -d' ' -f1)"
          "${joba_ssh[@]}" "root@$JOBA_SSH_HOST" "echo '$joba_digest  $joba_remote_archive' | sha256sum -c -"
          joba_remote_script="/tmp/joba-deploy-$GITHUB_SHA.sh"
          "${joba_scp[@]}" scripts/deploy-server.sh "root@$JOBA_SSH_HOST:$joba_remote_script"
          joba_script_digest="$(sha256sum scripts/deploy-server.sh | cut -d' ' -f1)"
          "${joba_ssh[@]}" -n "root@$JOBA_SSH_HOST" "echo '$joba_script_digest  $joba_remote_script' | sha256sum -c -"
          # Execute a file: Git/Docker subprocesses must never consume bash's script input.
          "${joba_ssh[@]}" -n "root@$JOBA_SSH_HOST" "bash '$joba_remote_script' '$GITHUB_SHA' '$joba_remote_archive' '$JOBA_DOMAIN' '$JOBA_SSH_HOST'"
          "${joba_ssh[@]}" -n "root@$JOBA_SSH_HOST" "test \"\$(readlink -f /opt/joba/current)\" = '/opt/joba/releases/$GITHUB_SHA/source'"
          curl --fail --silent --show-error "https://$JOBA_DOMAIN/health"
          printf '### Verified URL\nhttps://%s/\n' "$JOBA_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
