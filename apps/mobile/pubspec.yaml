name: services_marketplace
description: JOBA mobile marketplace client
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  file_picker: ^10.3.3
  crypto: ^3.0.6
  web_socket_channel: ^3.0.3
  flutter_svg: ^2.2.1
  path_provider: ^2.1.5
  web: ^1.1.1
  intl: ^0.20.2
dev_dependencies:
  flutter_secure_storage_web: ^1.2.1
  flutter_web_plugins:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/joba-logo-original.jpeg
  fonts:
    - family: Noto
      fonts:
        - asset: assets/NotoSans-Regular.ttf
        - asset: assets/NotoSans-Bold.ttf
          weight: 700
